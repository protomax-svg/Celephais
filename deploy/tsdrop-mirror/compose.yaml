# The laptop's fallback copy of TSDROP. Sits beside the laptop's Nextcloud and
# shares nothing with it. Proxmox fills ./data every 5 minutes over SFTP
# (celephais-tsdrop-mirror); this container only serves it, at the same path
# the Proxmox server uses, so the app can fall over to it unchanged.
#
#   cd ~/tsdrop-mirror && docker compose up -d
#
#   ./data     what the app sees - an exact mirror of Proxmox
#   ./archive  everything the mirror ever deleted or overwrote, by date
#   ./conf     htpasswd, copied from Proxmox so one password opens both
services:
  tsdrop-mirror:
    image: httpd:2.4
    container_name: tsdrop-mirror
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "8081:8080"
    volumes:
      - ./httpd.conf:/usr/local/apache2/conf/httpd.conf:ro
      # The directory, not the file: the sync replaces htpasswd by renaming a
      # new one into place, and a bind-mounted file would keep the old inode.
      - ./conf:/conf:ro
      - ./data:/data
