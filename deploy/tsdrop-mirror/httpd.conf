# Just enough Apache for TSDROP: mod_dav on one path, basic auth, nothing else.
ServerRoot "/usr/local/apache2"
Listen 8080
ServerName tsdrop-mirror

LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule authn_core_module modules/mod_authn_core.so
LoadModule authn_file_module modules/mod_authn_file.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_user_module modules/mod_authz_user.so
LoadModule auth_basic_module modules/mod_auth_basic.so
LoadModule alias_module modules/mod_alias.so
LoadModule dir_module modules/mod_dir.so
LoadModule mime_module modules/mod_mime.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule dav_module modules/mod_dav.so
LoadModule dav_fs_module modules/mod_dav_fs.so
LoadModule filter_module modules/mod_filter.so
LoadModule deflate_module modules/mod_deflate.so
LoadModule setenvif_module modules/mod_setenvif.so

# The container runs as protomax (user: in compose.yaml), so what the app
# writes here the SFTP sync can read and replace. Not root, so no User/Group
# switch - the image has no passwd entry for 1000 to switch to anyway.
PidFile /tmp/httpd.pid

ErrorLog /proc/self/fd/2
LogLevel warn
LogFormat "%h %u %t \"%r\" %>s %b" short
CustomLog /proc/self/fd/1 short
TypesConfig conf/mime.types

DavLockDB /tmp/dav-lockdb
LimitRequestBody 0
Timeout 3600
KeepAlive On
KeepAliveTimeout 30
MaxKeepAliveRequests 2000
EnableSendfile On

DocumentRoot "/usr/local/apache2/htdocs"
<Directory />
  AllowOverride None
  Require all denied
</Directory>

Alias /remote.php/dav/files/transferapp/file-transfer-app /data
<Directory /data>
  DAV On
  # Folder listings (PROPFIND) and message JSON shrink ~10x when gzipped. By type
  # (AddOutputFilterByType) does not reach mod_dav's own responses, so: gzip every
  # reply, then exempt file transfers - media is compressed already and big files
  # should keep sendfile - except .json, which is what the app reads all day.
  SetOutputFilter DEFLATE
  SetEnvIf Request_Method "^(GET|HEAD|PUT)$" no-gzip
  SetEnvIfNoCase Request_URI "\.json$" !no-gzip
  Options None
  DirectorySlash Off
  FileETag MTime Size
  AuthType Basic
  AuthName "tsdrop"
  AuthBasicProvider file
  AuthUserFile /conf/htpasswd
  Require valid-user
</Directory>
